services:
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_DB: doubleledger
      POSTGRES_USER: doubleledger
      POSTGRES_PASSWORD: doubleledger
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "doubleledger", "-d", "doubleledger"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
