name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Protocol Buffers tools
        run: make proto-tools
      - name: Check Protocol Buffers contract and generated code
        run: make proto-check
      - name: Check Protocol Buffers compatibility with main
        run: |
          if git cat-file -e origin/main:buf.yaml 2>/dev/null; then
            .tools/bin/buf breaking --against '.git#branch=origin/main'
          fi
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...
