name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: asdf-vm/actions/setup@v4
      - name: Install Go and Task
        run: |
          asdf plugin add golang https://github.com/asdf-community/asdf-golang.git
          asdf plugin add task https://github.com/particledecay/asdf-task.git
          asdf install
      - name: Install Protocol Buffers tools
        run: task proto:tools
      - name: Check Protocol Buffers contract and generated code
        run: task proto:check
      - name: Check Protocol Buffers compatibility with main
        run: task proto:breaking
      - name: Check Go formatting, tests, and build
        run: task check
